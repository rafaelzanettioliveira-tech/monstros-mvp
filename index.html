<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#14120f" />
    <title>Monstros da Mata · MVP</title>
    <style>html,body{touch-action:none;background:#14120f;height:100%;margin:0;overflow:hidden}#jogo{position:fixed;inset:0}#controles{pointer-events:none;-webkit-user-select:none;user-select:none;height:0;position:fixed;inset:auto 0 0}#controles[hidden]{display:none}.dpad,.botoes{bottom:calc(18px + env(safe-area-inset-bottom,0px));pointer-events:auto;position:fixed}.dpad{left:calc(16px + env(safe-area-inset-left,0px));width:138px;height:138px}.dpad button{width:46px;height:46px;position:absolute}.dpad [data-botao=cima]{top:0;left:46px}.dpad [data-botao=baixo]{bottom:0;left:46px}.dpad [data-botao=esquerda]{top:46px;left:0}.dpad [data-botao=direita]{top:46px;right:0}.botoes{right:calc(16px + env(safe-area-inset-right,0px));width:132px;height:100px}.botoes button{border-radius:50%;width:58px;height:58px;font:700 20px Trebuchet MS,sans-serif;position:absolute}.botoes [data-botao=a]{top:0;right:0}.botoes [data-botao=b]{bottom:0;left:0}#controles button{color:#ece4d8;touch-action:none;-webkit-tap-highlight-color:transparent;background:#2b2620b8;border:2px solid #5b5048e6;border-radius:10px}#controles .botoes button{border-radius:50%}#controles button.ativo{background:#e07a3abf}</style>
    <script type="module" crossorigin src="./assets/index-BRTVXlqr.js"></script>
  </head>
  <body>
    <div id="jogo"></div>
    <div id="controles" hidden>
      <div class="dpad">
        <button data-botao="cima" aria-label="Cima">▲</button>
        <button data-botao="esquerda" aria-label="Esquerda">◀</button>
        <button data-botao="direita" aria-label="Direita">▶</button>
        <button data-botao="baixo" aria-label="Baixo">▼</button>
      </div>
      <div class="botoes">
        <button data-botao="a" aria-label="Botão A">A</button>
        <button data-botao="b" aria-label="Botão B">B</button>
      </div>
    </div>
  </body>
</html>
